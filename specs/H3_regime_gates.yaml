regime_configuration:
  R1:
    model: 2-state Gaussian HMM (switching mean, variance)
    input: returns / trailing-252 σ (t−252…t−1)
    fit_window: 1008
    refit_every: 21
    order: by σ; regime 1 = high σ
    output: one-step-ahead P(high-σ at t+1 | ≤ t)
    favourable: P > 0.5
    pi: reported, not fixed (arbitrary when a refit is degenerate)
  R2:
    model: MS-AR(1), intercept form (switching c, φ, σ²)
    input: d*_t (§8.1, n = 5)
    fit_window: 1008
    refit_every: 21
    order: by φ; regime 0 = smaller φ = fast reversion
    swap_flag: '|φ₁ − φ₀| < 0.05'
    output: one-step-ahead P(fast at t+1 | ≤ t)
    favourable: P > 0.5
    pi: reported, not fixed
