# DRAFT (U9; amended 2026-10-21 after U10). Not a registered spec; the runner refuses it.
id: H4_blend
status: draft — not registered; U11 completes it
blend:
  weight: w_t = 0.5 + κ (P_t − 0.5)
  P_t: B1 favourable-set indicator at the decision (σ̂ of returns over 21 in the top two quintiles of its trailing
    504; H3's B1 gate, specs/H3_regime_gates.yaml)
  w_values: [0.25, 0.75]
  kappa: 0.5
  components:
  - R0 (H1 region)
  - TSMOM {21, 63, 126, 252}, equal weight
weight_configuration:
  B1:
    column: B1_vol
    definition: σ̂ of close-to-close returns over 21 (features/state.py REGISTERED.vol)
    rule: q_above
    threshold: 0.6
    trailing_quantile_window: 504
    pi: 0.4
variants:
- 'R2: w_t from R2''s one-step-ahead P(fast reversion), the configuration below (U10 caveat: on 2016-2025 its two
  φs differ by 0.028 at the median, 103 of 121 refits swap-flagged; reported, not a headline)'
- 'B1_percentile: P_t = B1''s trailing-504 percentile (continuous)'
- 'B6_diff: P_t from B6 computed on MR − TF (63-session net P&L of MR minus TF > 0)'
- 'hard_switch: w_t ∈ {0, 1}'
- 'kappa: κ ∈ {0.25, 0.75}'
- 'vol_target_10: the blend vol-targeted at 10 %'
regime_configuration:
  R2:
    model: MS-AR(1), intercept form (switching c, φ, σ²)
    input: d*_t (§8.1, n = 5)
    fit_window: 1008
    refit_every: 21
    order: by φ; regime 0 = smaller φ = fast reversion
    swap_flag: '|φ₁ − φ₀| < 0.05'
    output: one-step-ahead P(fast at t+1 | ≤ t)
    favourable: P > 0.5
    pi: reported, not fixed
    random_walk_phi_126:
      window: 126
      mean: 0.7059145678476755
      sd: 0.05480026751628675
      q05: 0.6092228482163446
      q95: 0.7891915044010612
    random_walk_r2_phi_pairs:
    - - 0.6331231890207236
      - 0.6531226009680899
    - - 0.6133111299707203
      - 0.7485606473918466
    - - 0.39071503307121913
      - 0.7619017214381908
    - - 0.6458285012219483
      - 0.6949883121899287
    - - 0.6006816905034809
      - 0.6788892823837224
    - - 0.6511363209803301
      - 0.6788653053722058
  R4: 'optional, not built (§7 U9)'
