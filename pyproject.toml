[project]
name = "vwap-mean-reversion"
version = "0.1.0"
description = "VWAP mean reversion on index ETFs, rebuilt as a pre-registered, regime-aware research program (PLAN.md)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.43.5",
    "matplotlib>=3.9",
    "numpy>=2.0.2",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "python-dotenv>=1.0",
    "pywavelets>=1.6",
    "pyyaml>=6.0",
    "requests>=2.32",
    "scipy>=1.13",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mfdfa>=0.4",
    "nolds>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.16.0",
    "ty>=0.0.64",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vwap_mr"]

[tool.ruff]
line-length = 110
extend-exclude = ["*.md"]  # PLAN.md/SPEC.md code blocks are prose, not formatted code

[tool.pytest.ini_options]
testpaths = ["tests"]
